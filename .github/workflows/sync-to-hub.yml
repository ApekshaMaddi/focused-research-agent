name: Sync to Hugging Face Hub

on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        uses: huggingface/hub-sync@v1
        with:
          github_repo_id: tusharkhoche/focused-research-agent
          huggingface_repo_id: tusharkhoche/focused-research-agent
          hf_token: ${{ secrets.HF_TOKEN }}