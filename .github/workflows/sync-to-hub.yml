name: Sync to Hugging Face Hub

on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://tusharkhoche:$HF_TOKEN@huggingface.co/spaces/tusharkhoche/focused-research-agent
          git push hf master:main --force