[project]
name = "focused-research-agent"
version = "0.1.0"
description = "A LangGraph-based focused research agent with LLM planning and Tavily web search"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.128.0",
    "langgraph==1.0.10",
    "langchain==1.2.10",
    "streamlit==1.52.2",
    "uvicorn==0.40.0",
    "python-dotenv==1.2.2",
    "tavily-python==0.7.22",
    "langchain-groq==1.1.2"
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff>=0.15.7",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
focused-research-agent = "focused_research_agent.cli:main"